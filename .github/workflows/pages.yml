name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compute base path
        id: base
        run: |
          case "${{ github.event.repository.name }}" in
            *.github.io) echo "base=" >> "$GITHUB_OUTPUT" ;;
            *) echo "base=/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Export static site
        env:
          BUILD_OUTPUT: export
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base.outputs.base }}
        run: bun run build

      - name: Nest export under base path (project pages)
        if: steps.base.outputs.base != ''
        run: |
          mkdir -p "out${{ steps.base.outputs.base }}"
          find out -mindepth 1 -maxdepth 1 ! -name "${{ steps.base.outputs.base }}" -exec mv {} "out${{ steps.base.outputs.base }}"/ \;

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4